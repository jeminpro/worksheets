<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Worksheets">
  <defs>
    <linearGradient id="bg" x1="4" y1="2" x2="28" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3a96c9"/>
      <stop offset="1" stop-color="#2b83b8"/>
    </linearGradient>
    <linearGradient id="sheet" x1="10" y1="6" x2="22" y2="26" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3f8fb"/>
    </linearGradient>
  </defs>

  <!-- App tile -->
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>

  <!-- Back sheet (slightly rotated) -->
  <g opacity="0.55">
    <rect x="11.2" y="5.4" width="13" height="17.5" rx="1.6" fill="#dff2ff" transform="rotate(10 17.7 14.15)"/>
  </g>

  <!-- Front worksheet -->
  <rect x="8" y="6.5" width="13.5" height="18.5" rx="1.6" fill="url(#sheet)"/>
  <rect x="8" y="6.5" width="13.5" height="18.5" rx="1.6" fill="none" stroke="#17324d" stroke-opacity="0.08"/>

  <!-- Margin rule -->
  <path d="M11.1 8.2v15.1" stroke="#e07a3f" stroke-width="1" stroke-linecap="round" opacity="0.85"/>

  <!-- Ruled lines -->
  <g stroke="#2b83b8" stroke-width="1.15" stroke-linecap="round" opacity="0.7">
    <path d="M12.6 11.2h6.4"/>
    <path d="M12.6 14.4h6.4"/>
    <path d="M12.6 17.6h6.4"/>
    <path d="M12.6 20.8h4.2"/>
  </g>

  <!-- Soft highlight -->
  <path d="M9.2 7.8c1.8-1 4.2-.7 5.6.2" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.55"/>
</svg>
